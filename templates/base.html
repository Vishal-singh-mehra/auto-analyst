<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Auto-Analyst{% endblock %} · Auto-Analyst</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        // Set the theme before the page paints, so it never flashes the wrong colours.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("aa-theme"); } catch (e) {}
            var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-in">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5" stroke="#F4C15A"/></svg>
                </span>
                <span class="brand-name">Auto-Analyst</span>
            </a>
            <nav class="nav" aria-label="Main">
                <a href="/" {% if active == "home" %}aria-current="page"{% endif %}>Upload</a>
                <a href="/dashboard" {% if active == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
            </nav>
            <span class="spacer"></span>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme">
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    {% block body %}{% endblock %}

    <script>
        document.getElementById("theme-toggle").addEventListener("click", function () {
            var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("aa-theme", next); } catch (e) {}
            window.dispatchEvent(new Event("themechange"));
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
